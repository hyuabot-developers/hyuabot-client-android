name: Draft Changelog on Docs

on:
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          VERSION=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read APP_VERSION_NAME from gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Find previous version-bump commit
        id: range
        run: |
          PREV_COMMIT=$(git log --no-merges --skip=1 -n 1 --format=%H -i -E --grep='^(chore: )?(bump|unify).*version')
          if [ -z "$PREV_COMMIT" ]; then
            PREV_COMMIT=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "prev=$PREV_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Build changelog body
        id: body
        run: |
          git log ${{ steps.range.outputs.prev }}..HEAD --no-merges --format='%s' \
            | grep -Eiv '^(chore: )?(bump|unify).*version' \
            > /tmp/commits.txt || true

          {
            echo 'body<<CHANGELOG_EOF'

            FEAT=$(grep -iE '^feat' /tmp/commits.txt | sed -E 's/^feat(\([^)]*\))?:? ?/- /I')
            if [ -n "$FEAT" ]; then
              echo '### 새로운 기능'
              echo "$FEAT"
              echo
            fi

            FIX=$(grep -iE '^fix' /tmp/commits.txt | sed -E 's/^fix(\([^)]*\))?:? ?/- /I')
            if [ -n "$FIX" ]; then
              echo '### 버그 수정'
              echo "$FIX"
              echo
            fi

            OTHER=$(grep -ivE '^(feat|fix)' /tmp/commits.txt | sed -E 's/^[a-zA-Z]+(\([^)]*\))?:? ?/- /')
            if [ -n "$OTHER" ]; then
              echo '### 기타 변경 사항'
              echo "$OTHER"
              echo
            fi

            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Checkout docs site
        uses: actions/checkout@v4
        with:
          repository: hyuabot-developers/hyuabot-developers.github.io
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          path: docs-site

      - name: Create draft branch and file
        id: draft
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BODY: ${{ steps.body.outputs.body }}
        working-directory: docs-site
        run: |
          BRANCH="changelog-draft/android-v${VERSION}"
          DATE=$(date +%Y-%m-%d)
          FILE="changelog/android/${DATE}-v${VERSION}.md"

          git config user.name "hyuabot-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BRANCH"

          {
            echo '---'
            echo "slug: v${VERSION}"
            echo "title: v${VERSION}"
            echo 'authors: []'
            echo 'tags: [android]'
            echo '---'
            echo
            echo "$BODY"
          } > "$FILE"

          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No changes to draft"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs: draft Android v${VERSION} changelog"
            git push -f origin "$BRANCH"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update draft PR
        if: steps.draft.outputs.has_changes == 'true'
        working-directory: docs-site
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.draft.outputs.branch }}
        run: |
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR already exists for $BRANCH"
          else
            gh pr create \
              --title "docs: Android v${VERSION} changelog draft" \
              --body "커밋 로그로 자동 생성한 초안입니다. 필요하면 내용을 수정한 뒤 머지해 주세요." \
              --base main \
              --head "$BRANCH" \
              --label documentation \
              --assignee jil8885
          fi
